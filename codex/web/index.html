<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CAELINUS CODEX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Ambient golden-dust layer -->
  <canvas id="ambient" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- Cinematic intro -->
  <div id="intro" class="intro">
    <div class="intro-inner">
      <svg id="lifeTree" class="life-tree" viewBox="0 0 200 240" aria-hidden="true"></svg>
      <h1 class="intro-title">CAELINUS</h1>
      <p class="intro-sub">C&nbsp;O&nbsp;D&nbsp;E&nbsp;X</p>
      <p class="intro-tag">The Living Digital Twin of Türkiye — Knowledge Archive</p>
      <button id="enterBtn" class="enter-btn">Enter the Codex</button>
      <p class="intro-hint">Bir ülke sadece sınırlarından mı oluşur?</p>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" class="app hidden">
    <aside class="rail">
      <div class="brand">
        <span class="brand-glyph">✷</span>
        <div>
          <div class="brand-name">CAELINUS CODEX</div>
          <div class="brand-sub" id="brandStats">loading…</div>
        </div>
      </div>

      <div class="search">
        <input id="searchInput" type="search" placeholder="Search the archive…" autocomplete="off" />
        <div id="searchResults" class="search-results"></div>
      </div>

      <nav class="tree" id="tree" aria-label="Volumes"></nav>

      <div class="rail-actions">
        <button class="pill" data-view="atlas">◈ Relation Atlas</button>
        <button class="pill" data-view="health">✓ Codex Health</button>
        <button class="pill" data-view="gallery">▦ Image Vault</button>
      </div>
    </aside>

    <main class="stage" id="stage">
      <div class="reader" id="reader"></div>
    </main>

    <!-- Entity flyout -->
    <div id="entityPanel" class="entity-panel hidden" aria-live="polite"></div>
  </div>

  <!-- Full-screen overlays -->
  <div id="overlay" class="overlay hidden">
    <button class="overlay-close" id="overlayClose" aria-label="Close">✕</button>
    <div class="overlay-body" id="overlayBody"></div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
